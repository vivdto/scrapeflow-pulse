<!DOCTYPE html>
<html>
<head>
    <title>Review Scraper</title>
</head>
<body>
    <h2>Review Scraper</h2>
    <form id="scrapeForm">
        <label>URL:</label>
        <input type="text" id="url" required><br><br>
        <label>Start Date:</label>
        <input type="date" id="start_date" required><br><br>
        <label>End Date:</label>
        <input type="date" id="end_date" required><br><br>
        <button type="submit">Scrape Reviews</button>
    </form>

    <div id="results"></div>

    <script>
        document.getElementById('scrapeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('url').value;
            const start_date = document.getElementById('start_date').value;
            const end_date = document.getElementById('end_date').value;

            const response = await fetch('http://localhost:5000/api/scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, start_date, end_date })
            });

            const data = await response.json();

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<h3>${data.result.productName}</h3>
                <p>Total Reviews Scraped: ${data.result.totalScrapedReviews}</p>
                <a href="/output/${data.filename}" download>Download JSON</a>
                <pre>${JSON.stringify(data.result.allReviews.slice(0, 5), null, 2)}</pre>`;
        });
    </script>
</body>
</html>
